name: AWS 3.6
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.6
      uses: actions/setup-python@v6
      with:
        python-version: 3.11
    - name: Run Python tests
      run: |
        python -m pytest -v test_hello.py
